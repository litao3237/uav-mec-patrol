case:
  name: stanislaus_groveland_real_geography
  description: Real-geography validation centered on the Groveland Ranger District, Stanislaus National Forest.
  depot:
    name: Groveland Ranger District Office
    latitude: 37.821982
    longitude: -120.098763
  task_radius_km: 4.0
  num_tasks: 50
  num_uavs: 5
  cycle_s: 2400.0
  avg_delay_budget_s: 1000.0
  max_contacts_per_uav: 3

uav:
  altitude_m: 30.0
  speed_mps: 10.0
  local_cpu_ghz: 1.0
  tx_power_w: 0.1
  flight_power_w: 180.0
  hover_power_w: 200.0
  energy_budget_j: 500000.0
  kappa: 1.0e-27

mec:
  sites:
    - name: Groveland Ranger District Office
      role: modeled_edge_at_real_ranger_station
      latitude: 37.821982
      longitude: -120.098763
      bandwidth_mhz: 4.0
      cpu_ghz: 5.0
      radius_m: 600.0
    - name: Smith Peak Lookout
      role: modeled_edge_at_real_communication_lookout
      latitude: 37.800522
      longitude: -120.100811
      bandwidth_mhz: 5.0
      cpu_ghz: 6.5
      radius_m: 800.0

task:
  data_mb_range: [1.0, 4.0]
  cycles_per_bit_range: [800.0, 1200.0]
  deadline_ratio_range: [0.30, 0.60]
  collect_s: 1.0
  deadline_lb_factor: 1.05
  selection: recent_unique

contact:
  ring_fractions: [0.50, 0.85]
  points_per_ring: 8
  include_center: true

channel:
  reference_gain_db: -50.0
  pathloss_exp: 2.3
  noise_psd_dbm_per_hz: -164.0

experiment:
  scenario_seed: 45
  algorithm_seed: 100
