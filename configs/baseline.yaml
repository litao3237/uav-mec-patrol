scenario:
  width_m: 1000.0
  height_m: 1000.0
  num_tasks: 50
  num_uavs: 5
  num_mecs: 3
  depot_xy: [100.0, 100.0]
  cycle_s: 450.0
  avg_delay_budget_s: 300.0
  max_contacts_per_uav: 3

uav:
  altitude_m: 30.0
  speed_mps: 10.0
  local_cpu_ghz: 1.0
  tx_power_w: 0.1
  flight_power_w: 180.0
  hover_power_w: 200.0
  energy_budget_j: 200000.0
  kappa: 1.0e-27

mec:
  # The first three sites are the current baseline. The fourth is reserved for
  # the E=4 scale sweep and can be recalibrated without changing solver code.
  sites:
    - {x: 100.0, y: 100.0, bandwidth_mhz: 4.0, cpu_ghz: 5.0, radius_m: 200.0}
    - {x: 850.0, y: 250.0, bandwidth_mhz: 5.0, cpu_ghz: 6.5, radius_m: 300.0}
    - {x: 500.0, y: 850.0, bandwidth_mhz: 8.0, cpu_ghz: 8.0, radius_m: 400.0}
    - {x: 850.0, y: 850.0, bandwidth_mhz: 6.0, cpu_ghz: 6.0, radius_m: 250.0}

task:
  data_mb_range: [1.0, 4.0]
  cycles_per_bit_range: [800.0, 1200.0]
  deadline_ratio_range: [0.55, 0.95]
  collect_s: 1.0
  margin_m: 20.0
  # Prevent only trivially impossible per-task deadlines. This does NOT force a
  # globally feasible route/offloading solution.
  deadline_lb_factor: 1.05

contact:
  # Continuous MEC coverage is discretized to configurable candidate points.
  ring_fractions: [0.50, 0.85]
  points_per_ring: 8
  include_center: true

channel:
  reference_gain_db: -50.0
  pathloss_exp: 2.3
  noise_psd_dbm_per_hz: -164.0

experiment:
  scenario_seed: 42
  algorithm_seed: 100
