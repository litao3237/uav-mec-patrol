name: Multiscale Ablation Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/multiscale-ablation-expansion
    paths:
      - 'experiments/run_multiscale_ablation.py'
      - '.github/workflows/multiscale_ablation_expansion.yml'

jobs:
  ablation:
    name: K${{ matrix.tasks }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tasks: [30, 50, 70, 80]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --dev
      - name: Run multiscale ablation
        run: >
          uv run python experiments/run_multiscale_ablation.py
          --tasks ${{ matrix.tasks }}
          --scenario-seeds 45,46,47
          --algorithm-seeds 100,101,102
          --output outputs/results/multiscale_ablation_K${{ matrix.tasks }}.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: multiscale-ablation-K${{ matrix.tasks }}
          path: outputs/results/multiscale_ablation_K${{ matrix.tasks }}.json
