name: P10 guarded FIFO/EDF chain destroy original ALNS pilot
on:
  push:
    branches: ['experiment/p10-queue-gated-critical-destroy']
    paths:
      - '.github/workflows/p10-queue-gated-pilot.yml'
      - 'experiments/run_p10_queue_guarded_pilot.py'
      - 'src/uav_mec/algorithms/alns/queue_operators.py'
      - 'src/uav_mec/algorithms/alns/runner.py'
      - 'tests/test_p10_queue_guarded_destroy.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install exact original P1-R and ESI resource dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify default-original ALNS, new critical chain operator and source identity
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_p10_queue_guarded_destroy.py tests/test_queue_aware_precheck.py tests/test_p7_alns_shadow_archive.py
          uv run --no-sync python experiments/run_p10_queue_guarded_pilot.py --help

  previously_inspected_scenes:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - scene: '89'
            source_run: 38202029324
            artifact: 'p3-fresh-S89-38202029324'
            source_path: 'input/K80_S89/p3-fresh-source-K80_S89.json'
            cases: 'deadline_x0p9:128'
          - scene: '91'
            source_run: 38202029324
            artifact: 'p3-fresh-S91-38202029324'
            source_path: 'input/K80_S91/p3-fresh-source-K80_S91.json'
            cases: 'compute_x1p5:128'
          - scene: '93'
            source_run: 38207186664
            artifact: 'p5-firstuse-S93-38207186664'
            source_path: 'input/K80_S93/p5-fresh-source-K80_S93.json'
            cases: 'compute_x1p5:130,baseline:129'
          - scene: '94'
            source_run: 38207186664
            artifact: 'p5-firstuse-S94-38207186664'
            source_path: 'input/K80_S94/p5-fresh-source-K80_S94.json'
            cases: 'compute_x1p5:129'
          - scene: '95'
            source_run: 38207186664
            artifact: 'p5-firstuse-S95-38207186664'
            source_path: 'input/K80_S95/p5-fresh-source-K80_S95.json'
            cases: 'compute_x2p0:130'
          - scene: '96'
            source_run: 38207186664
            artifact: 'p5-firstuse-S96-38207186664'
            source_path: 'input/K80_S96/p5-fresh-source-K80_S96.json'
            cases: 'deadline_x0p9:130'
    runs-on: windows-latest
    timeout-minutes: 130
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install unchanged published ALNS/ESI and Stage1/Stage2 constraints
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Retrieve original S89-S96 inspected source and B endpoint hashes
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact }}
          path: input/
      - name: Reproduce same B SHA and compare exactly one destroy-operator replacement
        run: |
          uv run --no-sync python experiments/run_p10_queue_guarded_pilot.py --source "${{ matrix.source_path }}" --cases "${{ matrix.cases }}" --output "outputs/p10-gated-S${{ matrix.scene }}.json"
      - name: Preserve original and targeted strict Stage1/Stage2 plus all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-gated-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: previously_inspected_scenes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p10-gated-S*-${{ github.run_id }}
          path: collected/
          merge-multiple: true
      - name: Aggregate original and critical-chain ALNS feasible structure funnel
        shell: bash
        run: |
          python - <<'PY'
          import json,statistics
          from pathlib import Path
          files=sorted(Path('collected').rglob('p10-gated-S*.json'))
          rows=[];errors=[]
          for f in files:
              b=json.loads(f.read_text(encoding='utf-8'))
              if not b.get('complete'):errors.append(f.name+':incomplete')
              errors+=b.get('errors',[])
              rows+=b.get('rows',[])
          arms=('original','queue_chain','queue_guarded_task','queue_guarded_chain','workload_guarded')
          def stats(arm):
              xs=[r['arms'].get(arm,{}) for r in rows]
              valid=[x for x in xs if 'funnel' in x]
              return {
                  'rows':len(xs),
                  'B_strict':sum(bool(x.get('B',{}).get('strict_both')) for x in xs),
                  'ESI_strict':sum(bool(x.get('ESI',{}).get('strict_both')) for x in xs),
                  'total_generated_D':sum(x['funnel']['counters'].get('unique_generated',0) for x in valid),
                  'queue_passing_D':sum(x['funnel']['counters'].get('queue_necessary_pass',0) for x in valid),
                  'joint_passing_D':sum(x['funnel']['counters'].get('joint_bw_cpu_necessary_pass',0) for x in valid),
                  'mean_search_s':statistics.mean(x['search_wall_s'] for x in valid) if valid else None,
                  'mean_complete_s':statistics.mean(x['complete_wall_s'] for x in valid) if valid else None,
              }
          result={
              'source_scenes':len(files),
              'physical_stress_case_replays':len(rows),
              'original_B_SHA_reproduced':sum(
                  r['arms'].get('original',{}).get('B',{}).get('sha256')==r['old_B_sha256']
                  for r in rows),
              'methods':{a:stats(a) for a in arms},
              'per_case':[
                  {'scene':r['scene'],'profile':r['profile'],'seed':r['seed'],
                   'old_status':r['old_B_stage1_status'],
                   'arms':{a:{
                       'queue':r['arms'][a]['funnel']['counters'].get('queue_necessary_pass',0),
                       'joint':r['arms'][a]['funnel']['counters'].get('joint_bw_cpu_necessary_pass',0),
                       'ESI_strict':r['arms'][a]['ESI']['strict_both'],
                       'complete_wall_s':r['arms'][a]['complete_wall_s'],
                       } for a in arms}}
                  for r in rows if all('funnel' in r['arms'].get(a,{}) for a in arms)],
              'matched_iterations_not_equal_complete_runtime':True,
              'already_inspected_development_scenarios':True,
              'errors':errors,
          }
          if len(files)!=6 or len(rows)!=7 or result['original_B_SHA_reproduced']!=7:
              errors.append('Missing preregistered 7-case or original ALNS trace mismatch')
          result['errors']=errors
          Path('outputs/summary').mkdir(parents=True,exist_ok=True)
          Path('outputs/summary/summary.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('P10_QUEUE_GATED_AGGREGATE='+json.dumps(result,ensure_ascii=False))
          if errors:raise RuntimeError('Untrustworthy original ALNS queue-destroy pilot '+str(errors[:3]))
          PY
      - name: Retain paired negative/successful feasibility source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-queue-chain-summary-${{ github.run_id }}
          path: outputs/summary/
          retention-days: 90
          if-no-files-found: warn
