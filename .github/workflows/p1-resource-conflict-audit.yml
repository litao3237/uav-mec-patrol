name: P1 frozen resource conflict and candidate screening attribution

on:
  push:
    branches: ['experiment/p1-resource-conflict-attribution']
    paths:
      - '.github/workflows/p1-resource-conflict-audit.yml'
      - 'experiments/atomic_batch_search.py'
      - 'experiments/run_p1_resource_conflict_audit.py'
      - 'experiments/summarize_p1_resource_conflict.py'
      - 'src/uav_mec/optimization/resource/elastic_diagnosis.py'
      - 'tests/test_atomic_batch_repair.py'
      - 'tests/test_elastic_diagnosis.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen numerical environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Validate strict solver and guarded optional provenance
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_atomic_batch_repair.py tests/test_elastic_diagnosis.py tests/test_progressive_bridge.py
          uv run --no-sync python experiments/run_p1_resource_conflict_audit.py --help
          uv run --no-sync python experiments/summarize_p1_resource_conflict.py --help

  resource_attribution:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        scenario: ['85','86','87','88']
    runs-on: windows-latest
    timeout-minutes: 115
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original P1-R/Stage2 resource environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Retrieve exactly frozen original S85-S88 physical sources
        uses: actions/download-artifact@v4
        with:
          run-id: 38134649545
          github-token: ${{ github.token }}
          name: atomic-holdout-S${{ matrix.scenario }}-38134649545
          path: input/
      - name: Replay candidate funnel and isolate original resource constraints
        run: |
          uv run --no-sync python experiments/run_p1_resource_conflict_audit.py --source "input/K80_S${{ matrix.scenario }}/atomic-fresh-source-K80_S${{ matrix.scenario }}.json" --previous "input/K80_S${{ matrix.scenario }}/atomic-K80_S${{ matrix.scenario }}.json" --output "outputs/p1-resource-S${{ matrix.scenario }}.json"
      - name: Preserve partial and complete numerical counterfactual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-resource-S${{ matrix.scenario }}-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 90

  summarize:
    needs: resource_attribution
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
      - name: Install fixed minimal environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e .
      - name: Gather immutable numerical candidate dossiers
        uses: actions/download-artifact@v4
        with:
          pattern: p1-resource-S*-${{ github.run_id }}
          path: outputs/collected/
          merge-multiple: true
      - name: Summarize only complete and audited failures
        run: |
          uv run --no-sync python experiments/summarize_p1_resource_conflict.py --input-dir outputs/collected --output-dir outputs/summary
      - name: Preserve aggregate and human report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-resource-summary-${{ github.run_id }}
          path: outputs/summary/
          if-no-files-found: warn
          retention-days: 90
