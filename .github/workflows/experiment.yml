name: Run current experiment block
on:
  workflow_dispatch:
    inputs:
      study:
        type: choice
        description: Experiment family (budget runs the complete sequential budget matrix)
        options: [main, contact, bandwidth, gis, budget]
        default: main
      tasks:
        type: choice
        options: ['30', '40', '50', '60', '70', '80']
        default: '40'
      scenario:
        type: choice
        options: ['45', '46', '47', '48', '49', '50', '51', '52']
        default: '45'
      level:
        type: string
        description: contact=1/2/3/4; bandwidth=0.5/1/1.5; gis=1
        default: '1'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      STUDY: ${{ inputs.study }}
      TASK_COUNT: ${{ inputs.tasks }}
      SCENARIO: ${{ inputs.scenario }}
      LEVEL: ${{ inputs.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e .
      - name: Run the requested block
        shell: pwsh
        run: |
          # 输入仅作为参数传入，由实验执行器验证，不拼接为可执行命令。
          if ($env:STUDY -eq 'main') {
            uv run --no-sync python experiments/run_seven_methods.py --phase formal --tasks $env:TASK_COUNT --scenario $env:SCENARIO --output "outputs/main/K$($env:TASK_COUNT)_S$($env:SCENARIO).json"
          } elseif ($env:STUDY -eq 'budget') {
            uv run --no-sync python experiments/run_budget_check.py --output-dir outputs/budget
          } else {
            uv run --no-sync python experiments/run_extension.py --study $env:STUDY --level $env:LEVEL --scenario $env:SCENARIO --output "outputs/extension/$($env:STUDY)_$($env:LEVEL)_S$($env:SCENARIO).json"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve complete and failed snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-${{ inputs.study }}-${{ inputs.tasks }}-${{ inputs.scenario }}-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
