name: P6 postbound MEC batch/contact reroute development pilot

on:
  push:
    branches: ['experiment/p6-postbound-feasibility-repair']
    paths:
      - 'experiments/postbound_conflict_moves.py'
      - 'experiments/run_p6_postbound_probe.py'
      - 'tests/test_p6_postbound_conflict_moves.py'
      - '.github/workflows/p6-postbound-conditional-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original ESI/ALNS and P1-R numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify structural target moves, original models and no false precheck
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_p6_postbound_conflict_moves.py tests/test_joint_station_bw_cpu_bound.py tests/test_station_cpu_share_bound.py
          uv run --no-sync python experiments/run_p6_postbound_probe.py --help

  development_scenarios:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - scene: '89'
            source_run: 38202029324
            artifact_name: 'p3-fresh-S89-38202029324'
            source_path: 'source/K80_S89/p3-fresh-source-K80_S89.json'
          - scene: '90'
            source_run: 38202029324
            artifact_name: 'p3-fresh-S90-38202029324'
            source_path: 'source/K80_S90/p3-fresh-source-K80_S90.json'
          - scene: '91'
            source_run: 38202029324
            artifact_name: 'p3-fresh-S91-38202029324'
            source_path: 'source/K80_S91/p3-fresh-source-K80_S91.json'
          - scene: '92'
            source_run: 38202029324
            artifact_name: 'p3-fresh-S92-38202029324'
            source_path: 'source/K80_S92/p3-fresh-source-K80_S92.json'
          - scene: '93'
            source_run: 38207186664
            artifact_name: 'p5-firstuse-S93-38207186664'
            source_path: 'source/K80_S93/p5-fresh-source-K80_S93.json'
          - scene: '94'
            source_run: 38207186664
            artifact_name: 'p5-firstuse-S94-38207186664'
            source_path: 'source/K80_S94/p5-fresh-source-K80_S94.json'
          - scene: '95'
            source_run: 38207186664
            artifact_name: 'p5-firstuse-S95-38207186664'
            source_path: 'source/K80_S95/p5-fresh-source-K80_S95.json'
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original frozen resource solver with independent stage audits
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Download already inspected source physical D (NOT new holdout)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact_name }}
          path: source/
      - name: Paired post-joint-CPU-BW bound conflict attribution and exact repair
        run: |
          uv run --no-sync python experiments/run_p6_postbound_probe.py --source "${{ matrix.source_path }}" --output "outputs/p6-postbound-S${{ matrix.scene }}.json"
      - name: Preserve all old successes, new successes, numeric failures and partial states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-postbound-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: development_scenarios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p6-postbound-S*-${{ github.run_id }}
          path: collected/
          merge-multiple: true
      - name: Report feasibility ladder, cost and same-family negative control
        shell: bash
        run: |
          python - <<'PY'
          import json,statistics
          from collections import Counter
          from pathlib import Path
          files=sorted(Path('collected').rglob('p6-postbound-S*.json'))
          blocks={};errors=[]
          for f in files:
              b=json.loads(f.read_text(encoding='utf-8'))
              scene=int(b['protocol']['scenario'])
              if scene in blocks:errors.append('duplicate scene '+str(scene))
              blocks[scene]=b
              if not b.get('complete'):errors.append(f.name+':incomplete')
              errors+=b.get('errors',[])
          arms=('p5_joint48','postbound_workload',
                'postbound_certificate_no_batch','postbound_certificate_full')
          def summarize(rows):
              eligible=[r for r in rows if r['eligible']]
              def arm(a):
                  vals=[r['arms'].get(a,{}) for r in eligible]
                  return {
                      'strict_both_recovered':sum(bool(x.get('strict_both_recovered')) for x in vals),
                      'source_attempts':len(vals),
                      'strict_Stage1_oracle_calls':sum(x.get('oracle_calls',0) for x in vals),
                      'mean_full_conditional_repair_wall_s':(
                          statistics.mean(x['full_conditional_repair_wall_s'] for x in vals)
                          if vals and all('full_conditional_repair_wall_s' in x for x in vals) else None),
                      'new_joint_passing_structures':sum(
                          x.get('extra_search',{}).get('new_joint_necessary_passing',0)
                          for x in vals),
                      'new_queue_passing_structures':sum(
                          x.get('extra_search',{}).get('counters',{}).get('joint_necessary_pass',0)
                          for x in vals),
                      'target_repair_attempted_sources':sum(
                          x.get('extra_search',{}).get('generated_failure_seeds',0)>0
                          for x in vals),
                      'extra_phase_aggregate_s':sum(
                          x.get('extra_search',{}).get('postbound_wall_s',0) for x in vals),
                  }
              compare='p5_joint48'
              deltas={}
              for arm_name in arms[1:]:
                  deltas[arm_name]={
                      'new_success':[
                          {'s':r['scenario'],'profile':r['profile'],'seed':r['seed']}
                          for r in eligible
                          if r['arms'].get(arm_name,{}).get('strict_both_recovered',False)
                          and not r['arms'].get(compare,{}).get('strict_both_recovered',False)],
                      'lost_success':[
                          {'s':r['scenario'],'profile':r['profile'],'seed':r['seed']}
                          for r in eligible
                          if not r['arms'].get(arm_name,{}).get('strict_both_recovered',False)
                          and r['arms'].get(compare,{}).get('strict_both_recovered',False)],
                  }
              return {'source_attempts':len(rows),'eligible_failed_source_D':len(eligible),
                      'methods':{a:arm(a) for a in arms},
                      'paired_gains_and_losses':deltas}
          bycohort={
              'P3_S89_S92':[89,90,91,92],
              'P5_S93_S95':[93,94,95],
              'all_development_S89_S95':list(range(89,96))}
          result={'scenes':sorted(blocks),'cohorts':{},'errors':errors,
                  'all_scenes_previously_inspected_for_algorithm_development':True,
                  'not_independent_new_holdout':True,
                  'not_full_equal_runtime_ESI_ALNS':True}
          for label,nums in bycohort.items():
              rows=[r for s in nums for r in blocks.get(s,{}).get('rows',[])]
              result['cohorts'][label]=summarize(rows)
          if sorted(blocks)!=list(range(89,96)):
              errors.append('Missing frozen development scene from S89-S95')
          if any(len(block['rows'])!=8 for block in blocks.values()):
              errors.append('Incomplete profile/nested seed original source coverage')
          result['errors']=errors
          Path('outputs/summary').mkdir(parents=True,exist_ok=True)
          Path('outputs/summary/summary.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('P6_POSTBOUND_AGGREGATE='+json.dumps(result,ensure_ascii=False))
          if errors:raise RuntimeError('Incomplete P6 evidence; no scientific conclusion')
          PY
      - name: Preserve full negative controls and all source failure denominators
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-postbound-summary-${{ github.run_id }}
          path: outputs/summary/
          retention-days: 90
          if-no-files-found: warn
