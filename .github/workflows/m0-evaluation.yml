name: M0 quality and frozen-scale pilots
on:
  push:
    branches: ['experiment/m0-evaluation-correction']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Syntax / undefined names
        run: uv run --no-sync python -m ruff check --select F821,E9 src experiments tests
      - name: M0, task QoS, numerical solver regression
        run: uv run --no-sync python -m pytest -q tests/test_m0_evaluation.py tests/test_task_qos.py tests/test_resource_solver.py tests/test_seven_method_metrics.py
      - name: Preserve v25 archived hashes
        run: uv run --no-sync python experiments/manage_results.py verify
  pilot:
    needs: quality-gate
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        tasks: [30, 50, 80]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install numerical environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Execute M0 seven-method pilot with one fixed scenario
        shell: pwsh
        run: |
          uv run --no-sync python experiments/run_seven_methods.py --qos-mode task-level --phase pilot --tasks ${{ matrix.tasks }} --scenario 45 --output "outputs/m0/pilot/K${{ matrix.tasks }}_S45.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw M0 snapshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-pilot-K${{ matrix.tasks }}-${{ github.run_id }}
          path: outputs/m0/pilot/
          if-no-files-found: warn
          retention-days: 90
  verify-pilot:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install verification environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - uses: actions/download-artifact@v4
        with:
          pattern: m0-pilot-K*-${{ github.run_id }}
          path: outputs/m0/pilot/
          merge-multiple: true
      - name: Require 21 planned rows and independently replay physical residuals
        run: uv run --no-sync python experiments/aggregate_task_qos.py --input-root outputs/m0/pilot --output-dir outputs/m0/aggregate --phase pilot
      - name: Preserve M0 verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-pilot-verified-${{ github.run_id }}
          path: outputs/m0/
          if-no-files-found: warn
          retention-days: 90
