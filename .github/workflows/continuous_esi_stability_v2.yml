name: continuous-esi-stability-v2

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/continuous-esi-stability-v2
    paths:
      - 'src/uav_mec/algorithms/alns/**'
      - 'src/uav_mec/algorithms/__init__.py'
      - 'tests/test_alns_framework.py'
      - 'experiments/run_continuous_esi_stability_v2.py'
      - 'experiments/aggregate_continuous_esi_stability_v2.py'
      - 'docs/continuous_esi_stability_v2_protocol.md'
      - '.github/workflows/continuous_esi_stability_v2.yml'

concurrency:
  group: continuous-esi-stability-v2
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff undefined-name check
        run: >-
          uvx ruff check --select F821
          src/uav_mec/algorithms/alns/runner.py
          src/uav_mec/algorithms/alns/continuous.py
          experiments/run_continuous_esi_stability_v2.py
          experiments/aggregate_continuous_esi_stability_v2.py
          tests/test_alns_framework.py
      - name: Focused ALNS tests
        run: uv run pytest tests/test_alns_framework.py -q
      - name: Full test suite
        run: uv run pytest -q

  compare:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        tasks: [50, 80]
        scenario: [61, 62, 63, 64, 65, 66, 67, 68]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run final holdout validation
        shell: bash
        run: |
          if [ "${{ matrix.tasks }}" = "50" ]; then
            TOTAL=15
            LEGACY_EXPLORE=11
            LEGACY_ELITE=4
          else
            TOTAL=45
            LEGACY_EXPLORE=38
            LEGACY_ELITE=7
          fi

          uv run python experiments/run_continuous_esi_stability_v2.py             --tasks ${{ matrix.tasks }}             --mecs 2             --uavs 5             --scenario-seed ${{ matrix.scenario }}             --algorithm-seed ${{ matrix.algorithm }}             --time-budget-s "$TOTAL"             --legacy-esi-exploration-s "$LEGACY_EXPLORE"             --legacy-esi-elite-s "$LEGACY_ELITE"             --output outputs/results/continuous_v2_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-v2-K${{ matrix.tasks }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/continuous_v2_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
          if-no-files-found: warn

  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: continuous-v2-K*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate holdout validation
        run: >-
          python experiments/aggregate_continuous_esi_stability_v2.py
          --input-dir outputs/results/matrix
          --output outputs/results/continuous_esi_v2_K50-80_S61-68_A100-102.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: continuous-esi-v2-aggregate
          path: outputs/results/continuous_esi_v2_K50-80_S61-68_A100-102.json
