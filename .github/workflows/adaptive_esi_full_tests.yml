name: adaptive-esi-full-tests

# 已冻结实验保留手动入口，合并到 develop 不自动重跑实验矩阵。
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run full test suite
        run: uv run pytest
