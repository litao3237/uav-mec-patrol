name: tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Check hybrid validation undefined names
        run: >-
          uvx ruff check --select F821
          experiments/run_hybrid_validation.py
          experiments/run_elite_family_ablation.py
          experiments/aggregate_elite_family_ablation.py
          experiments/run_core_baseline_comparison.py
          experiments/aggregate_core_baselines.py
          experiments/run_ga_baseline_comparison.py
          experiments/aggregate_ga_baselines.py
          experiments/aggregate_uav_sensitivity.py
          experiments/aggregate_paper_metrics.py
          experiments/run_small_strong_benchmark.py
          experiments/aggregate_small_strong_benchmark.py
          experiments/aggregate_mec_environment_sensitivity.py
          experiments/aggregate_convergence_study.py
          experiments/aggregate_dense_workload.py
          experiments/aggregate_spatial_robustness.py
          experiments/prepare_stanislaus_real_case.py
          experiments/run_real_geography_case.py
          experiments/run_convergence_study.py
      - name: Run tests
        run: uv run pytest
