name: Progressive infeasible-bridge UAV-MEC feasibility pilot
on:
  push:
    branches: ['experiment/progressive-feasibility-bridge']
    paths:
      - 'experiments/progressive_bridge_core.py'
      - 'experiments/run_progressive_bridge.py'
      - 'experiments/summarize_progressive_bridge.py'
      - 'tests/test_progressive_bridge.py'
      - '.github/workflows/progressive-bridge-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Frozen solver dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify original and progressive tests and script syntax
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_progressive_bridge.py tests/test_queue_guided_repair.py tests/test_queue_aware_precheck.py tests/test_resource_solver.py
      - name: Source immutable high-load stress from prior paper experiments
        uses: actions/download-artifact@v4
        with:
          run-id: 38043248604
          github-token: ${{ github.token }}
          name: model-sensitivity-K80-S61-38043248604
          path: input/
      - name: K80 S61 A111 limited progressive pilot
        run: |
          uv run --no-sync python experiments/run_progressive_bridge.py --input input/sensitivity-K80_S61.json --profiles compute_x1p5,deadline_x0p9 --seeds 111 --beam-width 2 --depth 3 --exact-limit 2 --generation-cap-s 2.5 --output outputs/bridge-smoke.json
      - name: Preserve unit tests and partial sample outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-smoke-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
  pilot:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        scenario: ['61','62','63','64']
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen resource solver
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Retrieve real previously failed source B-ALNS structures
        uses: actions/download-artifact@v4
        with:
          run-id: 38043248604
          github-token: ${{ github.token }}
          name: model-sensitivity-K80-S${{ matrix.scenario }}-38043248604
          path: input/
      - name: Strict same-D depth2 vs depth4 vs infeasible-diverse bridge
        run: |
          uv run --no-sync python experiments/run_progressive_bridge.py --input "input/sensitivity-K80_S${{ matrix.scenario }}.json" --beam-width 2 --depth 4 --exact-limit 3 --generation-cap-s 4.0 --output "outputs/bridge-K80_S${{ matrix.scenario }}.json"
      - name: Retain all strict and failed repairs, including times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-K80-S${{ matrix.scenario }}-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
  summarize:
    needs: pilot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
      - name: Install report environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e .
      - name: Fetch complete and partial paired pilot runs
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-K80-S*-${{ github.run_id }}
          path: outputs/collected/
          merge-multiple: true
      - name: Aggregate strict Stage1/Stage2 recovery and CPU time
        run: |
          uv run --no-sync python experiments/summarize_progressive_bridge.py --input-dir outputs/collected --output-dir outputs/bridge-summary --scenarios "61,62,63,64"
      - name: Preserve pilot results and failure cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-summary-${{ github.run_id }}
          path: outputs/bridge-summary/
          if-no-files-found: warn
          retention-days: 90
