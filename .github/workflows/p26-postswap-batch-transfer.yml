name: P26 post-swap batch MEC station offload migration original hardware
on:
  push:
    branches: ['experiment/p26-postswap-mec-batch-transfer']
    paths:
      - '.github/workflows/p26-postswap-batch-transfer.yml'
      - 'experiments/run_p26_postswap_mec_batch_transfer.py'
      - 'experiments/summarize_p26_batch_transfer.py'
      - 'tests/test_p26_postswap_mec_batch_transfer.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original unmodified P1-R/ALNS model and numerical tests
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify legal bundle relocation, same hardware, original strict CVX
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_p26_postswap_mec_batch_transfer.py tests/test_p25_joint_two_task_rebalance.py
          uv run --no-sync python experiments/run_p26_postswap_mec_batch_transfer.py --help

  seen_cases:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {scene: '91', run: 38202029324, source_artifact: 'p3-fresh-S91-38202029324', source_file: 'source/K80_S91/p3-fresh-source-K80_S91.json', cases: 'compute_x1p5:128'}
          - {scene: '93', run: 38207186664, source_artifact: 'p5-firstuse-S93-38207186664', source_file: 'source/K80_S93/p5-fresh-source-K80_S93.json', cases: 'compute_x1p5:130,baseline:129'}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original Stage1 Stage2 physics dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Restore original physical original B source D
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: ${{ matrix.source_artifact }}
          path: source/
      - name: Restore exact P22 critical exchange fixed D
        uses: actions/download-artifact@v4
        with:
          run-id: 38370212481
          github-token: ${{ github.token }}
          name: p22-exchange-S${{ matrix.scene }}-38370212481
          path: p22/
      - name: Exact multi-task MEC alternative station batch relocation, original resources
        run: |
          uv run --no-sync python experiments/run_p26_postswap_mec_batch_transfer.py --source "${{ matrix.source_file }}" --p22 "p22/p22-exchange-S${{ matrix.scene }}.json" --cases "${{ matrix.cases }}" --output "outputs/p26-batch-S${{ matrix.scene }}.json"
      - name: Preserve every legal candidate strict solver negative and positive
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p26-batch-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: seen_cases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-batch-S*-${{ github.run_id }}
          path: collected/
          merge-multiple: true
      - name: Aggregate matched 6-CVX CPU/BW/queue/random strict comparisons
        run: |
          python experiments/summarize_p26_batch_transfer.py --collected collected --output outputs/summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p26-batch-summary-${{ github.run_id }}
          path: outputs/summary/
          retention-days: 90
