name: P23 exact P22 repaired D cross-UAV MEC CPU bandwidth interaction
on:
  push:
    branches: ['experiment/p23-exchange-capacity-coupling']
    paths:
      - '.github/workflows/p23-capacity-exchange-interaction.yml'
      - 'experiments/run_p23_exchange_capacity_interaction.py'
      - 'experiments/summarize_p23_exchange_capacity.py'
      - 'tests/test_p23_exchange_capacity_interaction.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original physics and frozen source experiment dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify capacity-only mutation and actual cross-UAV reconstruction
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_p23_exchange_capacity_interaction.py tests/test_p22_deadline_cross_uav_exchange.py
          uv run --no-sync python experiments/run_p23_exchange_capacity_interaction.py --help

  inspected_sources:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {scene: '89', run: 38202029324, source_artifact: 'p3-fresh-S89-38202029324', source_file: 'source/K80_S89/p3-fresh-source-K80_S89.json', cases: 'deadline_x0p9:128'}
          - {scene: '91', run: 38202029324, source_artifact: 'p3-fresh-S91-38202029324', source_file: 'source/K80_S91/p3-fresh-source-K80_S91.json', cases: 'compute_x1p5:128'}
          - {scene: '93', run: 38207186664, source_artifact: 'p5-firstuse-S93-38207186664', source_file: 'source/K80_S93/p5-fresh-source-K80_S93.json', cases: 'compute_x1p5:130,baseline:129'}
          - {scene: '95', run: 38207186664, source_artifact: 'p5-firstuse-S95-38207186664', source_file: 'source/K80_S95/p5-fresh-source-K80_S95.json', cases: 'compute_x2p0:130'}
          - {scene: '96', run: 38207186664, source_artifact: 'p5-firstuse-S96-38207186664', source_file: 'source/K80_S96/p5-fresh-source-K80_S96.json', cases: 'deadline_x0p9:130'}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install unchanged original P1-R solver
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Download exact original original B source D
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: ${{ matrix.source_artifact }}
          path: source/
      - name: Download P22 preregistered chosen cross-UAV exchange D identity
        uses: actions/download-artifact@v4
        with:
          run-id: 38370212481
          github-token: ${{ github.token }}
          name: p22-exchange-S${{ matrix.scene }}-38370212481
          path: p22/
      - name: Frozen repaired D capacity 5-way factor interactions
        run: |
          uv run --no-sync python experiments/run_p23_exchange_capacity_interaction.py --source "${{ matrix.source_file }}" --p22 "p22/p22-exchange-S${{ matrix.scene }}.json" --cases "${{ matrix.cases }}" --output "outputs/p23-interaction-S${{ matrix.scene }}.json"
      - name: Archive strict Stage1 Stage2 pairwise interactions and all rejections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-interaction-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: inspected_sources
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p23-interaction-S*-${{ github.run_id }}
          path: collected/
          merge-multiple: true
      - name: Aggregate complete P23 paired structural and numerical capacity outcomes
        run: |
          python experiments/summarize_p23_exchange_capacity.py --collected collected --output outputs/summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p23-interaction-summary-${{ github.run_id }}
          path: outputs/summary/
          retention-days: 90
