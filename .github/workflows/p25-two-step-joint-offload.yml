name: P25 original MEC capacity two-task offload repair joint bandwidth CPU
on:
  push:
    branches: ['experiment/p25-postswap-two-step-joint-resource-repair']
    paths:
      - '.github/workflows/p25-two-step-joint-offload.yml'
      - 'experiments/run_p25_joint_two_task_rebalance.py'
      - 'experiments/summarize_p25_joint_two_task.py'
      - 'tests/test_p25_joint_two_task_rebalance.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original P1-R MEC physics and dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Test two distinct task moves, complete D, deterministic SHA and all ranking controls
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_p25_joint_two_task_rebalance.py tests/test_p24_postswap_offload_redistribution.py
          uv run --no-sync python experiments/run_p25_joint_two_task_rebalance.py --help

  seen_cases:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {scene: '91', run: 38202029324, source_artifact: 'p3-fresh-S91-38202029324', source_file: 'source/K80_S91/p3-fresh-source-K80_S91.json', cases: 'compute_x1p5:128'}
          - {scene: '93', run: 38207186664, source_artifact: 'p5-firstuse-S93-38207186664', source_file: 'source/K80_S93/p5-fresh-source-K80_S93.json', cases: 'compute_x1p5:130,baseline:129'}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original physical model numerical and oracle solver
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Download original K80 physical B endpoint archive
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: ${{ matrix.source_artifact }}
          path: source/
      - name: Download exact frozen P22 cross-UAV swap SHA evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 38370212481
          github-token: ${{ github.token }}
          name: p22-exchange-S${{ matrix.scene }}-38370212481
          path: p22/
      - name: Generate two-step legal offload moves and joint CPU/BW necessary bound
        run: |
          uv run --no-sync python experiments/run_p25_joint_two_task_rebalance.py --source "${{ matrix.source_file }}" --p22 "p22/p22-exchange-S${{ matrix.scene }}.json" --cases "${{ matrix.cases }}" --output "outputs/p25-two-step-S${{ matrix.scene }}.json"
      - name: Retain every selected candidate failed strict numerical case and source SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p25-two-step-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: seen_cases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p25-two-step-S*-${{ github.run_id }}
          path: collected/
          merge-multiple: true
      - name: Independent strict Stage1 Stage2 success same final candidate pool verification
        run: |
          python experiments/summarize_p25_joint_two_task.py --collected collected --output outputs/summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p25-two-step-summary-${{ github.run_id }}
          path: outputs/summary/
          retention-days: 90
