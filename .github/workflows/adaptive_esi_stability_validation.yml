name: adaptive-esi-stability-validation

# 已冻结实验保留手动入口，合并到 develop 不自动重跑实验矩阵。
on:
  workflow_dispatch:

concurrency:
  group: adaptive-esi-stability-validation
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff undefined-name check
        run: >-
          uvx ruff check --select F821
          src/uav_mec/algorithms/alns/runner.py
          src/uav_mec/algorithms/alns/adaptive.py
          experiments/run_adaptive_esi_stability.py
          experiments/aggregate_adaptive_esi_stability.py
          tests/test_alns_framework.py
      - name: Focused ALNS tests
        run: uv run pytest tests/test_alns_framework.py -q

  compare:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        tasks: [50, 80]
        scenario: [53, 54, 55, 56, 57, 58, 59, 60]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unseen-scenario stability validation
        shell: bash
        run: |
          if [ "${{ matrix.tasks }}" = "50" ]; then
            TOTAL=15
            LEGACY_EXPLORE=11
            LEGACY_ELITE=4
          else
            TOTAL=45
            LEGACY_EXPLORE=38
            LEGACY_ELITE=7
          fi

          uv run python experiments/run_adaptive_esi_stability.py             --tasks ${{ matrix.tasks }}             --mecs 2             --uavs 5             --scenario-seeds ${{ matrix.scenario }}             --algorithm-seeds ${{ matrix.algorithm }}             --time-budget-s "$TOTAL"             --legacy-esi-exploration-s "$LEGACY_EXPLORE"             --legacy-esi-elite-s "$LEGACY_ELITE"             --stagnation-fraction 0.20             --min-exploration-fraction 0.35             --elite-burst-fraction 0.15             --max-elite-triggers 2             --output outputs/results/adaptive_stability_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-stability-K${{ matrix.tasks }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/adaptive_stability_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
          if-no-files-found: warn

  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: adaptive-stability-K*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate stability validation
        run: >-
          python experiments/aggregate_adaptive_esi_stability.py
          --input-dir outputs/results/matrix
          --output outputs/results/adaptive_stability_K50-80_S53-60_A100-102.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-esi-stability-aggregate
          path: outputs/results/adaptive_stability_K50-80_S53-60_A100-102.json
