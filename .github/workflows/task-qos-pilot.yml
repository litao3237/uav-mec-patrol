name: v26 Task QoS pilot (30/50/80)
on:
  push:
    branches: ['experiment/task-qos-physical-v26']
    paths:
      - '.github/workflows/task-qos-pilot.yml'
      - 'src/**'
      - 'experiments/**'
      - 'configs/**'
      - 'tests/test_task_qos.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install pinned numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify new task-QoS invariants
        run: uv run --no-sync python -m pytest -q tests/test_task_qos.py
  pilot:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        tasks: [30, 50, 80]
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install pinned numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: v26 independent seven-method pilot
        shell: pwsh
        run: |
          uv run --no-sync python experiments/run_seven_methods.py --qos-mode task-level --phase pilot --tasks ${{ matrix.tasks }} --scenario 45 --output "outputs/task_qos/pilot/K${{ matrix.tasks }}_S45.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve incomplete and complete v26 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-pilot-K${{ matrix.tasks }}-${{ github.run_id }}
          path: outputs/task_qos/pilot/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install pinned numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - uses: actions/download-artifact@v4
        with:
          pattern: v26-pilot-K*-${{ github.run_id }}
          path: outputs/task_qos/pilot
          merge-multiple: true
      - name: Verify all complete rows, aggregate and plot
        run: |
          uv run --no-sync python experiments/aggregate_task_qos.py --input-root outputs/task_qos/pilot --output-dir outputs/task_qos/aggregate
          uv run --no-sync python experiments/plot_task_qos.py --summary outputs/task_qos/aggregate/task_qos_summary.csv --output-dir outputs/task_qos/figures
      - name: Preserve verified aggregate and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-pilot-verified-${{ github.run_id }}
          path: outputs/task_qos/
          if-no-files-found: warn
          retention-days: 90
