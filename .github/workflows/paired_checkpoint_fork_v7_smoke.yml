name: Paired Checkpoint Fork v7 Smoke

# 已冻结实验保留手动入口，合并到 develop 不自动重跑实验矩阵。
on:
  workflow_dispatch:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --dev

      - name: Paired checkpoint unit tests
        run: uv run pytest tests/test_paired_checkpoint_session.py

      - name: One-pair v7 mechanism smoke
        run: >
          uv run python experiments/run_paired_checkpoint_fork_v7.py
          --tasks 50
          --scenario-seeds 85
          --algorithm-seeds 100
          --output outputs/results/paired_checkpoint_fork_v7_smoke.json

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-checkpoint-fork-v7-smoke
          path: outputs/results/paired_checkpoint_fork_v7_smoke.json
          if-no-files-found: warn
