name: budget-aware-terminal-first-esi-v5

# 已冻结实验保留手动入口，合并到 develop 不自动重跑实验矩阵。
on:
  workflow_dispatch:

concurrency:
  group: budget-aware-terminal-first-esi-v5
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff undefined-name check
        run: >-
          uvx ruff check --select F821
          src/uav_mec/algorithms/alns/budget_aware_terminal_first.py
          experiments/run_budget_aware_terminal_first_v5.py
          experiments/aggregate_budget_aware_terminal_first_v5.py
          tests/test_alns_framework.py
      - name: Focused ALNS tests
        run: uv run pytest tests/test_alns_framework.py -q
      - name: Full test suite
        run: uv run pytest -q

  compare:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        tasks: [50, 80]
        scenario: [85, 86, 87, 88, 89, 90, 91, 92]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run v5 holdout validation
        shell: bash
        run: |
          if [ "${{ matrix.tasks }}" = "50" ]; then
            TOTAL=15
            LEGACY_EXPLORE=11
            LEGACY_ELITE=4
          else
            TOTAL=45
            LEGACY_EXPLORE=38
            LEGACY_ELITE=7
          fi

          uv run python experiments/run_budget_aware_terminal_first_v5.py             --tasks ${{ matrix.tasks }}             --mecs 2             --uavs 5             --scenario-seed ${{ matrix.scenario }}             --algorithm-seed ${{ matrix.algorithm }}             --time-budget-s "$TOTAL"             --legacy-esi-exploration-s "$LEGACY_EXPLORE"             --legacy-esi-elite-s "$LEGACY_ELITE"             --output outputs/results/budget_aware_v5_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-aware-v5-K${{ matrix.tasks }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/budget_aware_v5_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
          if-no-files-found: warn

  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: budget-aware-v5-K*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate v5 holdout
        run: >-
          python experiments/aggregate_budget_aware_terminal_first_v5.py
          --input-dir outputs/results/matrix
          --output outputs/results/budget_aware_v5_K50-80_S85-92_A100-102.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: budget-aware-terminal-first-v5-aggregate
          path: outputs/results/budget_aware_v5_K50-80_S85-92_A100-102.json
