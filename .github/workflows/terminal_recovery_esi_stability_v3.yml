name: terminal-recovery-esi-stability-v3

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/terminal-recovery-stability-v3
    paths:
      - 'src/uav_mec/algorithms/alns/**'
      - 'src/uav_mec/algorithms/__init__.py'
      - 'src/uav_mec/optimization/resource/**'
      - 'tests/test_alns_framework.py'
      - 'experiments/run_terminal_recovery_stability_v3.py'
      - 'experiments/aggregate_terminal_recovery_stability_v3.py'
      - 'docs/terminal_recovery_stability_v3_protocol.md'
      - '.github/workflows/terminal_recovery_esi_stability_v3.yml'

concurrency:
  group: terminal-recovery-esi-stability-v3
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff undefined-name check
        run: >-
          uvx ruff check --select F821
          src/uav_mec/algorithms/alns/terminal_recovery.py
          src/uav_mec/algorithms/alns/problem_operators.py
          src/uav_mec/algorithms/alns/hybrid.py
          src/uav_mec/optimization/resource/cvx_solver.py
          src/uav_mec/optimization/resource/solver.py
          experiments/run_terminal_recovery_stability_v3.py
          experiments/aggregate_terminal_recovery_stability_v3.py
          tests/test_alns_framework.py
      - name: Focused ALNS tests
        run: uv run pytest tests/test_alns_framework.py -q
      - name: Full test suite
        run: uv run pytest -q

  compare:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        tasks: [50, 80]
        scenario: [69, 70, 71, 72, 73, 74, 75, 76]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run v3 holdout validation
        shell: bash
        run: |
          if [ "${{ matrix.tasks }}" = "50" ]; then
            TOTAL=15
            LEGACY_EXPLORE=11
            LEGACY_ELITE=4
          else
            TOTAL=45
            LEGACY_EXPLORE=38
            LEGACY_ELITE=7
          fi

          uv run python experiments/run_terminal_recovery_stability_v3.py             --tasks ${{ matrix.tasks }}             --mecs 2             --uavs 5             --scenario-seed ${{ matrix.scenario }}             --algorithm-seed ${{ matrix.algorithm }}             --time-budget-s "$TOTAL"             --legacy-esi-exploration-s "$LEGACY_EXPLORE"             --legacy-esi-elite-s "$LEGACY_ELITE"             --output outputs/results/terminal_v3_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-v3-K${{ matrix.tasks }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/terminal_v3_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
          if-no-files-found: warn

  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-v3-K*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate v3 holdout
        run: >-
          python experiments/aggregate_terminal_recovery_stability_v3.py
          --input-dir outputs/results/matrix
          --output outputs/results/terminal_recovery_v3_K50-80_S69-76_A100-102.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: terminal-recovery-esi-v3-aggregate
          path: outputs/results/terminal_recovery_v3_K50-80_S69-76_A100-102.json
