name: P31 binding aware cross-UAV ALNS original MEC equal-clock firstuse S135 S138
on:
  push:
    branches: ['experiment/p31-binding-aware-alns-repair-holdout']
    paths:
      - '.github/workflows/p31-binding-aware-alns-firstuse.yml'
      - 'experiments/p31_binding_aware_repair.py'
      - 'experiments/run_p31_binding_alns_holdout.py'
      - 'experiments/summarize_p31_firstuse.py'
      - 'tests/test_p31_binding_aware_repair.py'
      - 'docs/p31-binding-aware-alns-preregistered-protocol.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install unchanged frozen original P1R CVX model
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Verify no baseline route/capacity change and exact-cost sham
        run: |
          uv run --no-sync python -m ruff check --select E9,F821 src experiments tests
          uv run --no-sync python -m pytest tests/test_p31_binding_aware_repair.py tests/test_p29_e1_binding_cross_uav.py
          uv run --no-sync python experiments/run_p31_binding_alns_holdout.py --help
          uv run --no-sync python experiments/summarize_p31_firstuse.py --help

  historical_development_replay:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {scene: '91', profile: 'compute_x1p5', seed: '128', run: 38202029324, artifact: 'p3-fresh-S91-38202029324', source_file: 'source/K80_S91/p3-fresh-source-K80_S91.json'}
          - {scene: '93', profile: 'baseline', seed: '129', run: 38207186664, artifact: 'p5-firstuse-S93-38207186664', source_file: 'source/K80_S93/p5-fresh-source-K80_S93.json'}
    runs-on: windows-latest
    timeout-minutes: 130
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install original frozen solver and ALNS
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Restore previously inspected original B source SHA
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact }}
          path: source/
      - name: Prove original and exact-work sham 100-step SHA identity on historical cases
        run: |
          uv run --no-sync python experiments/run_p31_binding_alns_holdout.py development --source "${{ matrix.source_file }}" --cases "${{ matrix.profile }}:${{ matrix.seed }}" --output "outputs/p31-historical-S${{ matrix.scene }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p31-historical-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  firstuse:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        scene: ['135','136','137','138']
        scale: ['30','50','80']
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install exact frozen original Stage1 Stage2 P1R model and ALNS
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Execute all five arms on first-use frozen physical scene and K-scale
        run: |
          uv run --no-sync python experiments/run_p31_binding_alns_holdout.py firstuse --scene ${{ matrix.scene }} --scale ${{ matrix.scale }} --output "outputs/p31-firstuse-K${{ matrix.scale }}_S${{ matrix.scene }}.json"
      - name: Preserve every strict positive and negative result original SHA wall time and screens
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p31-K${{ matrix.scale }}-S${{ matrix.scene }}-${{ github.run_id }}
          path: outputs/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: firstuse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p31-K*-S*-${{ github.run_id }}
          path: collected/
          merge-multiple: true
      - name: Aggregate 12 blocks 36 paired physical profiles nested seed without false independent count
        run: |
          python experiments/summarize_p31_firstuse.py --collected collected --output outputs/summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p31-binding-firstuse-summary-${{ github.run_id }}
          path: outputs/summary/
          retention-days: 90
