name: core-baseline-comparison

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/core_baseline_comparison.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scenario: [45, 46, 47]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run core baseline comparison
        run: >-
          uv run python experiments/run_core_baseline_comparison.py
          --tasks 80
          --mecs 2
          --scenario-seeds ${{ matrix.scenario }}
          --algorithm-seeds ${{ matrix.algorithm }}
          --iterations 100
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-baseline-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/baseline_core_K80_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}_I100.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-latest
    needs: compare
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: core-baseline-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate results
        run: >-
          python experiments/aggregate_core_baselines.py
          --input-dir outputs/results/matrix
          --output outputs/results/core_baseline_K80_E2_S45-46-47_A100-101-102_I100_matrix.json
      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: core-baseline-K80-E2-matrix
          path: outputs/results/core_baseline_K80_E2_S45-46-47_A100-101-102_I100_matrix.json
