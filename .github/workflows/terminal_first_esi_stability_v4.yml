name: terminal-first-esi-stability-v4

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/terminal-first-stability-v4
    paths:
      - 'src/uav_mec/algorithms/alns/**'
      - 'src/uav_mec/algorithms/__init__.py'
      - 'tests/test_alns_framework.py'
      - 'experiments/run_terminal_first_stability_v4.py'
      - 'experiments/aggregate_terminal_first_stability_v4.py'
      - 'docs/terminal_first_stability_v4_protocol.md'
      - '.github/workflows/terminal_first_esi_stability_v4.yml'

concurrency:
  group: terminal-first-esi-stability-v4
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff undefined-name check
        run: >-
          uvx ruff check --select F821
          src/uav_mec/algorithms/alns/terminal_first.py
          experiments/run_terminal_first_stability_v4.py
          experiments/aggregate_terminal_first_stability_v4.py
          tests/test_alns_framework.py
      - name: Focused ALNS tests
        run: uv run pytest tests/test_alns_framework.py -q
      - name: Full test suite
        run: uv run pytest -q

  compare:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        tasks: [50, 80]
        scenario: [77, 78, 79, 80, 81, 82, 83, 84]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run v4 holdout validation
        shell: bash
        run: |
          if [ "${{ matrix.tasks }}" = "50" ]; then
            TOTAL=15
            LEGACY_EXPLORE=11
            LEGACY_ELITE=4
          else
            TOTAL=45
            LEGACY_EXPLORE=38
            LEGACY_ELITE=7
          fi

          uv run python experiments/run_terminal_first_stability_v4.py             --tasks ${{ matrix.tasks }}             --mecs 2             --uavs 5             --scenario-seed ${{ matrix.scenario }}             --algorithm-seed ${{ matrix.algorithm }}             --time-budget-s "$TOTAL"             --legacy-esi-exploration-s "$LEGACY_EXPLORE"             --legacy-esi-elite-s "$LEGACY_ELITE"             --output outputs/results/terminal_first_v4_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-first-v4-K${{ matrix.tasks }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/terminal_first_v4_K${{ matrix.tasks }}_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
          if-no-files-found: warn

  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-first-v4-K*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate v4 holdout
        run: >-
          python experiments/aggregate_terminal_first_stability_v4.py
          --input-dir outputs/results/matrix
          --output outputs/results/terminal_first_v4_K50-80_S77-84_A100-102.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: terminal-first-esi-v4-aggregate
          path: outputs/results/terminal_first_v4_K50-80_S77-84_A100-102.json
