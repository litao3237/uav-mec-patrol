name: small-strong-benchmark-pilot

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/small_strong_benchmark_pilot.yml'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run small strong-reference pilot
        run: >-
          uv run python experiments/run_small_strong_benchmark.py
          --tasks 28
          --uavs 2
          --mecs 2
          --scenario-seeds 45
          --standard-seeds 100,101,102
          --strong-seeds 700,701,702,703
          --standard-iterations 100
          --strong-iterations 300
          --standard-elite-rounds 2
          --strong-elite-rounds 4
          --output outputs/results/small_strong_pilot_K28_M2_E2_S45.json
      - name: Aggregate pilot
        run: >-
          python experiments/aggregate_small_strong_benchmark.py
          --input-dir outputs/results
          --output-json outputs/results/small_strong_pilot_aggregate.json
          --output-csv outputs/results/small_strong_pilot_aggregate.csv
      - name: Upload pilot
        uses: actions/upload-artifact@v4
        with:
          name: small-strong-benchmark-pilot
          path: |
            outputs/results/small_strong_pilot_K12_M1_E2_S45.json
            outputs/results/small_strong_pilot_aggregate.json
            outputs/results/small_strong_pilot_aggregate.csv
