name: v26 Formal task-QoS matrix (816 runs)
on:
  push:
    branches: ['experiment/task-qos-physical-v26']
    paths:
      - '.github/workflows/task-qos-formal.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen solver and analysis environment
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Test all v26 task-level invariants
        run: uv run --no-sync python -m pytest -q tests/test_task_qos.py
      - name: Confirm original archive remains intact
        run: uv run --no-sync python experiments/manage_results.py verify
  pilot:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        tasks: [30, 50, 80]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Execute pilot seven-method scenario
        shell: pwsh
        run: |
          uv run --no-sync python experiments/run_seven_methods.py --qos-mode task-level --phase pilot --tasks ${{ matrix.tasks }} --scenario 45 --output "outputs/task_qos/full_gate/K${{ matrix.tasks }}_S45.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete and partial records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-gate-K${{ matrix.tasks }}-${{ github.run_id }}
          path: outputs/task_qos/full_gate/
          if-no-files-found: warn
          retention-days: 90
  verify-pilot:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - uses: actions/download-artifact@v4
        with:
          pattern: v26-gate-K*-${{ github.run_id }}
          path: outputs/task_qos/full_gate/
          merge-multiple: true
      - name: Require 21 task-level records and independently replay physical residuals
        run: |
          uv run --no-sync python experiments/aggregate_task_qos.py --input-root outputs/task_qos/full_gate --output-dir outputs/task_qos/gate_summary --phase pilot
  formal:
    needs: verify-pilot
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tasks: [30, 40, 50, 60, 70, 80]
        scenario: [45, 46, 47, 48, 49, 50, 51, 52]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Execute all 17 method-seed rows in this scenario
        shell: pwsh
        run: |
          uv run --no-sync python experiments/run_seven_methods.py --qos-mode task-level --phase formal --tasks ${{ matrix.tasks }} --scenario ${{ matrix.scenario }} --output "outputs/task_qos/formal/K${{ matrix.tasks }}_S${{ matrix.scenario }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain every raw scenario file, including interrupted checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-formal-K${{ matrix.tasks }}-S${{ matrix.scenario }}-${{ github.run_id }}
          path: outputs/task_qos/formal/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: formal
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install frozen numerical dependencies
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - uses: actions/download-artifact@v4
        with:
          pattern: v26-formal-K*-S*-${{ github.run_id }}
          path: outputs/task_qos/formal/
          merge-multiple: true
      - name: Require exactly 816 planned physical runs and independently replay hard residuals
        run: |
          uv run --no-sync python experiments/aggregate_task_qos.py --input-root outputs/task_qos/formal --output-dir outputs/task_qos/aggregate --phase formal
      - name: Plot all task-level primary metrics and strict auxiliary success
        run: |
          uv run --no-sync python experiments/plot_task_qos.py --summary outputs/task_qos/aggregate/task_qos_summary.csv --output-dir outputs/task_qos/figures
      - name: Publish independently verified v26 results and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-formal-verification-${{ github.run_id }}
          path: outputs/task_qos/
          if-no-files-found: warn
          retention-days: 90
