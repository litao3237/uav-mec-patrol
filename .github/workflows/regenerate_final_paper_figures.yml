name: Regenerate Final Paper Figures

on:
  push:
    branches:
      - experiment/paired-checkpoint-fork-v7
    paths:
      - ".github/workflows/regenerate_final_paper_figures.yml"
      - "paper_figures/scripts/**"
      - "paper_figures/data/**"
      - "paper_results/**"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poppler
        shell: powershell
        run: choco install poppler -y --no-progress
      - name: Install figure dependencies
        shell: powershell
        run: python -m pip install -r paper_figures/requirements-experiments-lock.txt
      - name: Regenerate and validate all paper figures
        shell: powershell
        run: |
          @'
          import sys, json, hashlib
          from pathlib import Path
          manifest_path = Path("paper_figures/data/experiment_sources.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for record in manifest["sources"].values():
              p = Path(record["json_path"])
              record["json_sha256"] = hashlib.sha256(p.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          sys.path.insert(0, "paper_figures/scripts")
          import prepare_experiment_data
          import experiment_data
          import verify_experiment_figures
          import plot_experiments
          prepare_experiment_data.preserve_existing = lambda: None
          experiment_data.preserve_existing = lambda: None
          verify_experiment_figures.preserve_existing = lambda: None
          plot_experiments.preserve_existing = lambda: None
          plot_experiments.main()
          '@ | python -
      - name: Upload validated paper figures
        uses: actions/upload-artifact@v4
        with:
          name: final-paper-figures-regenerated
          path: |
            paper_figures/output/png/
            paper_figures/output/pdf/
            paper_figures/output/svg/
            paper_figures/experiment_verification.json
            paper_figures/experiment_verification.md
            paper_figures/data/experiment_validation.json
            paper_figures/data/figure_registry.json
          if-no-files-found: error
