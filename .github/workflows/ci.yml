name: Current code and recorded evidence
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.5'
          enable-cache: true
      - name: Install numerical environment and package
        run: |
          uv venv --python 3.14.5 .venv
          uv pip install -r configs/requirements-frozen.txt
          uv pip install -e ".[dev,plot]"
      - name: Check undefined names and syntax
        run: uv run --no-sync python -m ruff check --select F821,E9 src experiments tests
      - name: Unit and regression tests
        run: uv run --no-sync python -m pytest --junitxml=outputs/tests.xml
      - name: Verify all archive and figure hashes
        run: uv run --no-sync python experiments/manage_results.py verify
      - name: Reconstruct all recorded residuals and statistics
        if: runner.os == 'Windows'
        run: uv run --no-sync python experiments/verify_recorded_results.py
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}
          path: |
            outputs/tests.xml
            outputs/reproduction/*.log
            outputs/reproduction/verification.json
            outputs/reproduction/figure_data_verification.json
          if-no-files-found: warn
          retention-days: 90
