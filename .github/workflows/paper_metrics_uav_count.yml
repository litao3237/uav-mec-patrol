name: paper-metrics-uav-count

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/paper_metrics_uav_count.yml'

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        uavs: [3, 5, 8]
        scenario: [45, 46, 47]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run UAV-count paper metrics
        run: >-
          uv run python experiments/run_hybrid_validation.py
          --tasks 80
          --mecs 2
          --uavs ${{ matrix.uavs }}
          --scenario-seeds ${{ matrix.scenario }}
          --algorithm-seeds ${{ matrix.algorithm }}
          --iterations 100
          --paper-metrics
          --output outputs/results/paper_metrics_uav_K80_M${{ matrix.uavs }}_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}_I100.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-uav-M${{ matrix.uavs }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/paper_metrics_uav_K80_M${{ matrix.uavs }}_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}_I100.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-latest
    needs: metrics
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-uav-M*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate UAV-count paper metrics
        run: >-
          python experiments/aggregate_paper_metrics.py
          --input-dir outputs/results/matrix
          --output-json outputs/results/paper_metrics_uav_K80_M3-5-8_E2_matrix.json
          --output-csv outputs/results/paper_metrics_uav_K80_M3-5-8_E2_matrix.csv
      - name: Upload UAV-count aggregate
        uses: actions/upload-artifact@v4
        with:
          name: paper-metrics-uav-K80-M3-5-8
          path: |
            outputs/results/paper_metrics_uav_K80_M3-5-8_E2_matrix.json
            outputs/results/paper_metrics_uav_K80_M3-5-8_E2_matrix.csv
