name: uav-count-sensitivity

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/uav_count_sensitivity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        uavs: [3, 5, 8]
        scenario: [45, 46, 47]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run UAV-count sensitivity
        run: >-
          uv run python experiments/run_hybrid_validation.py
          --tasks 80
          --mecs 2
          --scenario-seeds ${{ matrix.scenario }}
          --algorithm-seeds ${{ matrix.algorithm }}
          --iterations 100
          --uavs ${{ matrix.uavs }}
          --output outputs/results/uav_sensitivity_K80_M${{ matrix.uavs }}_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}_I100.json
      - name: Upload seed-pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uav-sens-M${{ matrix.uavs }}-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/uav_sensitivity_K80_M${{ matrix.uavs }}_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}_I100.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: uav-sens-M*-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate UAV-count sensitivity
        run: >-
          python experiments/aggregate_uav_sensitivity.py
          --input-dir outputs/results/matrix
          --output outputs/results/uav_sensitivity_K80_M3-5-8_E2_S45-46-47_A100-101-102_I100_matrix.json
      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: uav-sensitivity-K80-M3-5-8-E2-matrix
          path: outputs/results/uav_sensitivity_K80_M3-5-8_E2_S45-46-47_A100-101-102_I100_matrix.json
