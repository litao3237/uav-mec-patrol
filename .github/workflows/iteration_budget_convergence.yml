name: iteration-budget-convergence

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/iteration_budget_convergence.yml'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scenario: [45, 46, 47]
        algorithm: [100, 101, 102]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run paired convergence study
        run: >-
          uv run python experiments/run_convergence_study.py
          --tasks 80
          --uavs 5
          --mecs 2
          --scenario-seed ${{ matrix.scenario }}
          --algorithm-seed ${{ matrix.algorithm }}
          --budgets 25,50,100,200
          --elite-rounds 2
          --output outputs/results/convergence_K80_M5_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
      - name: Upload pair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-S${{ matrix.scenario }}-A${{ matrix.algorithm }}
          path: outputs/results/convergence_K80_M5_E2_S${{ matrix.scenario }}_A${{ matrix.algorithm }}.json
          if-no-files-found: warn

  aggregate:
    runs-on: ubuntu-latest
    needs: study
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: convergence-S*-A*
          path: outputs/results/matrix
          merge-multiple: true
      - name: Aggregate convergence study
        run: >-
          python experiments/aggregate_convergence_study.py
          --input-dir outputs/results/matrix
          --output-json outputs/results/convergence_K80_M5_E2_matrix.json
          --output-csv outputs/results/convergence_K80_M5_E2_matrix.csv
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: convergence-K80-M5-E2
          path: |
            outputs/results/convergence_K80_M5_E2_matrix.json
            outputs/results/convergence_K80_M5_E2_matrix.csv
